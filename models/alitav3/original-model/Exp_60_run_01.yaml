#MD_EMPTY_THRESHOLD:  0.4 #If the md score is below this the image will automatically be classed as 'empty' unless classifier > 0.2
ACTIVATION: 'Sigmoid' # 'SoftMax'  Sigmoid for BCE loss, otherwise Softmax


